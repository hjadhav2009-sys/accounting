name: certified-baseline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: phase2_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: business_automation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase2_ci -d business_automation_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: test
      POSTGRES_TEST_DATABASE_URL: postgresql://phase2_ci:synthetic-ci-only@localhost:5432/business_automation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q apps shared v2 tests
      - run: python -m unittest discover -s . -p "test_*.py" -v
      - run: python -m pip check
      - run: python tests/tools/create_synthetic_legacy_db.py /tmp/synthetic-legacy.db
      - run: python -m v2.backend.app.infrastructure.migration_verifier --dry-run --sqlite /tmp/synthetic-legacy.db
      - run: npm ci
        working-directory: v2/frontend
      - run: npm run typecheck
        working-directory: v2/frontend
      - run: npm run build
        working-directory: v2/frontend
      - name: Public-tree safety
        shell: bash
        run: |
          test -z "$(git ls-files '*.db' '*.sqlite' '*.sqlite3' '*.pdf' '*.xlsx' '*.xls' '*.csv' '*.xml' '*.pem' '*.key')"
          ! git grep -nE '\b[0-9]{12,18}\b|AKIA[0-9A-Z]{16}|BEGIN (RSA |OPENSSH )?PRIVATE KEY'
